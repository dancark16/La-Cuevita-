# La Cuevita en producción:  docker compose -f docker-compose.prod.yml up -d --build
# (o renombra este archivo a docker-compose.yml en el servidor). Variables en el archivo .env
name: lacuevita

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tienda}
      POSTGRES_USER: ${POSTGRES_USER:-tienda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./tienda-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-tienda}
      POSTGRES_USER: ${POSTGRES_USER:-tienda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ORDERS_ALLOW_DELETE: ${ORDERS_ALLOW_DELETE:-false}
      ORDER_RESERVATION_HOURS: ${ORDER_RESERVATION_HOURS:-48}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: tienda-frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

  # Copia de seguridad diaria de la base de datos y de las fotos (carpeta ./backups)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tienda}
      POSTGRES_USER: ${POSTGRES_USER:-tienda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-0}
      TZ: America/Guayaquil
    command: ["sh", "/scripts/backup-loop.sh"]
    volumes:
      - ./backups:/backups
      - uploads:/data/uploads:ro
      - ./deploy/backup:/scripts:ro

  # Solo para restaurar:  docker compose --profile tools run --rm restore sh /scripts/restore.sh <db> <uploads>
  restore:
    profiles: ["tools"]
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tienda}
      POSTGRES_USER: ${POSTGRES_USER:-tienda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - uploads:/data/uploads
      - ./deploy/backup:/scripts:ro

  # Solo para pedir el certificado HTTPS (una vez):  docker compose --profile tools run --rm certbot-issue
  certbot-issue:
    profiles: ["tools"]
    image: certbot/certbot
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot -d $${DOMAIN}
      --email $${LETSENCRYPT_EMAIL} --agree-tos --no-eff-email --non-interactive"
    environment:
      DOMAIN: ${DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  # Renueva el certificado solo, cuando falta poco para que venza
  certbot-renew:
    image: certbot/certbot
    restart: unless-stopped
    profiles: ["tls"]
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  db_data:
  uploads:
  certs:
  certbot_www:
