spring:
  application:
    name: tienda-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 120MB

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:tienda}
    username: ${POSTGRES_USER:tienda_user}
    password: ${POSTGRES_PASSWORD:change_me_local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    # Se activa solo si defines MAIL_HOST. Para Gmail: smtp.gmail.com, puerto 587 y una "contraseña de aplicación".
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 8000
      mail.smtp.timeout: 8000
      mail.smtp.writetimeout: 8000

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # Dirección pública de la tienda; sale en los botones de los correos.
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-en-produccion-minimo-32-caracteres-1234567890}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  billing:
    tax-rate: 0.15
  cookie:
    secure: false
  orders:
    # Solo para pruebas: permite borrar pedidos desde el panel. En producción poner ORDERS_ALLOW_DELETE=false.
    allow-delete: ${ORDERS_ALLOW_DELETE:true}
    # Horas que se aparta el stock de un pedido sin pagar antes de cancelarlo solo (0 = nunca).
    reservation-hours: ${ORDER_RESERVATION_HOURS:48}
  store:
    new-product-days: 30
  google:
    client-id: ${GOOGLE_CLIENT_ID:820353047340-34r03a8plv0qtjsm3j3pefeuv716u7dv.apps.googleusercontent.com}
  storage:
    root: ${UPLOAD_DIR:uploads}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
