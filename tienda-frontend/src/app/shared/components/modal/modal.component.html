@if (!embedded()) {
  <div class="backdrop" (click)="closed.emit()"></div>
}
<div class="modal" [class.modal--sm]="size() === 'sm'" [class.modal--lg]="size() === 'lg'" role="dialog" aria-modal="true" [attr.aria-label]="title()">
  <header class="modal__header">
    <span class="modal__icon" [class.modal__icon--danger]="tone() === 'danger'" aria-hidden="true">
      <span class="material-icons">{{ icon() }}</span>
    </span>
    <div class="modal__heading">
      <h2 class="modal__title">{{ title() }}</h2>
      @if (subtitle()) {
        <p class="modal__subtitle">{{ subtitle() }}</p>
      }
    </div>
    <button type="button" class="modal__close" aria-label="Cerrar" (click)="closed.emit()">
      <span class="material-icons" aria-hidden="true">close</span>
    </button>
  </header>

  <div class="modal__body">
    <ng-content />
  </div>

  <div class="modal__footer">
    <ng-content select="[modalFooter]" />
  </div>
</div>
