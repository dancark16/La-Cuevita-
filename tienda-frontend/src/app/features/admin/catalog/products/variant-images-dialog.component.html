<div class="dialog">
  <header class="dialog__head">
    <h2 class="dialog__title"><span class="slash" aria-hidden="true">/</span>Fotos · {{ data.variant.sku }}</h2>
    <button type="button" class="dialog__close" aria-label="Cerrar" (click)="close()">
      <span class="material-icons" aria-hidden="true">close</span>
    </button>
  </header>

  <label
    class="drop"
    [class.drop--over]="dragging()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
  >
    <input class="drop__input" type="file" accept="image/jpeg,image/png,image/webp" multiple (change)="onChosen($event)" />
    @if (uploading()) {
      <span class="spinner" aria-hidden="true"></span>
      <span class="drop__title">Subiendo fotos...</span>
    } @else {
      <span class="material-icons drop__icon" aria-hidden="true">add_photo_alternate</span>
      <span class="drop__title">Arrastra tus fotos aquí o haz clic para elegirlas</span>
      <span class="drop__hint">JPG, PNG o WebP · hasta 10 MB cada una · la primera será la principal</span>
    }
  </label>

  @if (images().length === 0) {
    <p class="empty">Esta variante aún no tiene fotos.</p>
  } @else {
    <ul class="photos">
      @for (image of images(); track image.id; let first = $first) {
        <li class="photo">
          <img class="photo__img" [src]="image.url" alt="Foto de la variante" loading="lazy" />
          <button type="button" class="photo__remove" aria-label="Quitar foto" (click)="remove(image)">
            <span class="material-icons" aria-hidden="true">close</span>
          </button>
          @if (first) {
            <span class="photo__badge">Principal</span>
          }
        </li>
      }
    </ul>
  }

  <footer class="dialog__foot">
    <button type="button" class="button" (click)="close()">Listo</button>
  </footer>
</div>
