<div class="admin">
  <aside class="sidebar" [class.sidebar--open]="menuOpen()">
    <a routerLink="/admin/dashboard" class="sidebar__brand" (click)="closeMenu()">
      <span class="material-icons sidebar__crown" aria-hidden="true">workspace_premium</span>
      <span class="sidebar__name">La Cuevita</span>
      <span class="sidebar__tag">Panel</span>
    </a>

    <nav class="sidebar__nav" aria-label="Administración">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="is-active"
          class="sidebar__link"
          (click)="closeMenu()"
        >
          <span class="material-icons sidebar__icon" aria-hidden="true">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <a routerLink="/" class="sidebar__link" (click)="closeMenu()">
        <span class="material-icons sidebar__icon" aria-hidden="true">storefront</span>
        Ver tienda
      </a>
    </div>
  </aside>

  @if (menuOpen()) {
    <button type="button" class="backdrop" aria-label="Cerrar menú" (click)="closeMenu()"></button>
  }

  <div class="main">
    <header class="topbar">
      <button type="button" class="topbar__menu" aria-label="Abrir menú" (click)="toggleMenu()">
        <span class="material-icons" aria-hidden="true">menu</span>
      </button>
      <span class="topbar__spacer"></span>
      <div class="topbar__user">
        <span class="topbar__avatar" aria-hidden="true">{{ user()?.email?.charAt(0)?.toUpperCase() }}</span>
        <span class="topbar__email">{{ user()?.email }}</span>
      </div>
      <button type="button" class="topbar__logout" (click)="logout()">
        <span class="material-icons" aria-hidden="true">logout</span>
        <span class="topbar__logout-text">Cerrar sesión</span>
      </button>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
