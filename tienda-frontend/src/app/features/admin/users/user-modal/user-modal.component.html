<app-modal
  icon="person_add"
  title="Nueva cuenta"
  subtitle="Para sumar a alguien al equipo. Después puede cambiar su contraseña desde «Olvidé mi contraseña»."
  (closed)="cancelled.emit()"
>
  <form class="form" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="field">
      <label class="field__label" for="user-email">Correo</label>
      <input
        id="user-email"
        class="field__input"
        [class.field__input--invalid]="form.controls.email.touched && form.controls.email.invalid"
        type="email"
        formControlName="email"
        autocomplete="off"
        placeholder="persona@correo.com"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field__error">Escribe un correo válido</span>
      }
    </div>

    <div class="field">
      <label class="field__label" for="user-password">Contraseña inicial</label>
      <div class="pw">
        <input
          id="user-password"
          class="field__input"
          [class.field__input--invalid]="form.controls.password.touched && form.controls.password.invalid"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
        />
        <button type="button" class="pw__btn" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Ocultar' : 'Mostrar'">
          <span class="material-icons" aria-hidden="true">{{ showPassword() ? 'visibility' : 'visibility_off' }}</span>
        </button>
        <button type="button" class="button button--outline pw__gen" (click)="generate()">Generar</button>
      </div>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__error">Mínimo 10 caracteres</span>
      } @else {
        <span class="field__hint">Mínimo 10 caracteres. Compártela con la persona por un medio seguro.</span>
      }
    </div>

    <div class="field">
      <span class="field__label">Tipo de cuenta</span>
      <app-select [options]="roleOptions" formControlName="role" />
    </div>

    <div class="form__actions">
      <button type="button" class="button button--outline" (click)="cancelled.emit()">Cancelar</button>
      <button type="submit" class="button button--primary" [disabled]="saving()">
        {{ saving() ? 'Creando...' : 'Crear cuenta' }}
      </button>
    </div>
  </form>
</app-modal>
