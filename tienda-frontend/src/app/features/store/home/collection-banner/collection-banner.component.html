<div class="banner__container">
  <section class="banner" [style.--banner-image]="'url(' + image + ')'">
    <div>
      <h2 class="banner__title">
        Nuevas
        <span class="banner__title-accent">colecciones</span>
      </h2>
      <p class="banner__text">Descubre lo último en la tienda</p>
      <a routerLink="/tienda" class="banner__cta">
        Ver novedades
        <span class="material-icons" aria-hidden="true">arrow_forward</span>
      </a>
    </div>

    <p class="banner__slogan" aria-hidden="true">Más que ropa, es actitud</p>
  </section>
</div>
