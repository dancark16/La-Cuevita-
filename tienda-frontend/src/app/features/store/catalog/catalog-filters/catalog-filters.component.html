<div class="filters">
  <form class="search" role="search" (submit)="onSearch($event, searchInput.value)">
    <label class="search__label" for="catalog-search">Buscar productos</label>
    <input
      #searchInput
      id="catalog-search"
      class="search__input"
      type="search"
      placeholder="Buscar por nombre"
      [value]="searchTerm"
    />
    <button type="submit" class="search__button">Buscar</button>
  </form>

  <label class="sort">
    <span class="sort__label">Ordenar</span>
    <app-select class="sort__select" variant="filter" ariaLabel="Ordenar" [options]="sortOptions" [value]="sort" (changed)="onSortChange($any($event))" />
  </label>
</div>
