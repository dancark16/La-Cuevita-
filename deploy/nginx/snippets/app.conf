root /usr/share/nginx/html;
index index.html;

# Tamaño por defecto para la API: de sobra para un pedido o un inicio de sesión (son
# unos pocos KB de texto). Las rutas que sí suben archivos grandes (fotos, comprobantes,
# el Excel de Codesoft) lo amplían más abajo, cada una a lo que de verdad necesita.
# Antes era 120m para TODA la API: una petición cualquiera (ni siquiera subir algo) podía
# traer hasta 120 MB y quedarse en la memoria del backend hasta tumbarlo.
client_max_body_size 2m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Docker resuelve el nombre «backend»; así, si el backend se recrea (por una actualización) Nginx no queda apuntando a la IP vieja
resolver 127.0.0.11 valid=10s ipv6=off;

# Ingresar, registrarse y recuperar contraseña: límite más estricto por IP real,
# además del que ya tiene el backend por cuenta y por IP.
location /api/auth/ {
    limit_req zone=api_auth burst=10 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

# Fotos de producto desde el panel: se suben varias a la vez.
location /api/admin/files/ {
    client_max_body_size 120m;
    limit_req zone=api_general burst=20 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

# El reporte de inventario de Codesoft en Excel.
location /api/admin/imports/ {
    client_max_body_size 20m;
    limit_req zone=api_general burst=20 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

# La foto o el PDF del comprobante de transferencia.
location ~ ^/api/orders/[^/]+/receipt$ {
    client_max_body_size 15m;
    limit_req zone=api_general burst=20 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

# El resto de la API (catálogo, carrito, pedidos, panel). El burst cubre una página
# cargando varias fotos y llamadas de golpe sin dejar pasar una avalancha sostenida.
location /api/ {
    limit_req zone=api_general burst=100 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

# Archivos de Angular con huella en el nombre: se pueden guardar un año
location ~* "^/[A-Za-z0-9_.-]+-[A-Z0-9]{8}\.(?:js|css)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

# Imágenes, fuentes e íconos del sitio
location ~* \.(?:png|jpe?g|webp|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

# El resto es la aplicación: cualquier ruta devuelve index.html y Angular decide
location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
}
