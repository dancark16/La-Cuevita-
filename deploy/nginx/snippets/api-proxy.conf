# Lo común para reenviar una petición de /api/ al backend. Se incluye desde cada
# location de app.conf para no repetirlo en cada una.
#
# $backend en vez de un nombre fijo: así el resolver de arriba vuelve a buscar la
# dirección del contenedor «backend» si Docker lo recrea (evita que Nginx se quede
# apuntando a una IP vieja después de una actualización).
set $backend http://backend:8080;
proxy_pass $backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# La IP real del que llama es $remote_addr (la ve Nginx directo, nadie la puede falsear).
# Nunca $proxy_add_x_forwarded_for: eso agrega la IP real a lo que ya haya en la cabecera,
# y el backend toma el PRIMER valor de la lista, que cualquiera puede inventar para saltarse
# el límite de intentos por IP (basta con mandar esa cabecera con un valor cualquiera).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
include /etc/nginx/snippets/security-headers.conf;
