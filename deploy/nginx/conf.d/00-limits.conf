# Cuántas peticiones por segundo se aceptan de una misma IP real (no de lo que diga
# X-Forwarded-For, que se puede falsear: $binary_remote_addr es la que ve Nginx directo).
# Esto frena una avalancha de peticiones desde una sola computadora, aunque ya haya
# pasado el límite propio del backend.
#
# api_auth: ingresar, registrarse, recuperar contraseña. Nadie legítimo necesita más de
# unos pocos intentos por segundo.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

# api_general: el resto de la API (catálogo, fotos, pedidos, panel). Una página con
# varias fotos puede disparar muchas peticiones de golpe; el "burst" de cada location
# cubre eso sin dejar pasar una avalancha sostenida.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

# A quien se pasa del límite se le responde 429 (como ya responde el propio backend),
# en vez del 503 por defecto de Nginx.
limit_req_status 429;
